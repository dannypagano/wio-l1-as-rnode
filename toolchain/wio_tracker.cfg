# OpenOCD config for SWD debugging the Wio Tracker L1 Pro via a Raspberry Pi's
# GPIO header (bit-banged SWD, no dedicated probe hardware needed).
#
# Wiring (board SWD header silkscreen, left to right: GND SWC SWD RST 3V3):
#   Board pin 1 (GND) -> Pi GND
#   Board pin 2 (SWC) -> Pi GPIO 25 (adjust to match below if different)
#   Board pin 3 (SWD) -> Pi GPIO 24 (adjust to match below if different)
#   Board pin 4 (RST) -> not connected
#   Board pin 5 (3V3) -> NOT CONNECTED (board is already USB-powered)
#
# Usage:
#   sudo openocd -f wio_tracker.cfg
# Then in a second terminal:
#   nc localhost 4444
# (telnet works identically if installed; nc is usually present by default)

adapter driver linuxgpiod

transport select swd

adapter gpio swclk -chip 0 25
adapter gpio swdio -chip 0 24

adapter speed 1000

source [find target/nrf52.cfg]
